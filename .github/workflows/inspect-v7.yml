name: Inspect V7 source for V8
on:
  push:
    branches: [v8-development]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect source
        run: |
          unzip -q Dhikri_Project_Adhkar_v7.zip -d extracted
          FILE=extracted/DhikriAndroid/app/src/main/java/com/dhikri/app/MainActivity.kt
          echo "TOTAL LINES: $(wc -l < "$FILE")"
          START=$(( ( ${{ matrix.part }} - 1 ) * 180 + 1 ))
          END=$(( ${{ matrix.part }} * 180 ))
          echo "=== SOURCE PART ${{ matrix.part }} LINES $START-$END ==="
          sed -n "${START},${END}p" "$FILE"
          if [ "${{ matrix.part }}" = "1" ]; then
            echo "=== APP GRADLE ==="
            cat extracted/DhikriAndroid/app/build.gradle.kts
            echo "=== MANIFEST ==="
            cat extracted/DhikriAndroid/app/src/main/AndroidManifest.xml
            echo "=== ROOT GRADLE ==="
            cat extracted/DhikriAndroid/build.gradle.kts
            echo "=== SETTINGS ==="
            cat extracted/DhikriAndroid/settings.gradle.kts
          fi
