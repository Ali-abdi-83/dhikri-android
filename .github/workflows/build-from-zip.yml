name: Build Dhikri APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q Dhikri_Project.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/DhikriAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Dhikri-APK
          path: extracted/DhikriAndroid/app/build/outputs/apk/debug/*.apk
